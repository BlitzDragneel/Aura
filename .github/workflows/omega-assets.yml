name: OMEGA asset bots (every 15 minutes)
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # 4 minutes after each 15-minute candle closes
    - cron: "51 3 2 * *"           # monthly retrain of the metal scouts
  workflow_dispatch:
    inputs:
      retrain: { description: "retrain the metal scouts now", type: boolean, default: false }
permissions:
  contents: write
concurrency:
  group: omega-assets
  cancel-in-progress: false
env:
  CODE_REF: claude/trading-edge-research-bots-gpkvi1
  OMEGA_OUTBOX: ${{ github.workspace }}/state/alerts/outbox.md   # every alert is written here; the Live API forwards it
jobs:
  desks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CODE_REF }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: bot-state, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet httpx pandas numpy pyarrow lightgbm scikit-learn
      - name: Retrain metal scouts (monthly)
        if: github.event.schedule == '51 3 2 * *' || inputs.retrain
        working-directory: code
        env:
          OMEGA_DATA: ${{ runner.temp }}/data
        run: |
          python edges/data/fetch_metals.py | tail -n 3
          python -W ignore -m edges.assetbots train all --out ../state/assets/models
      - name: Read, call, score
        working-directory: code
        env:
          SCOUT_MODELS: ${{ github.workspace }}/state/scouts/models
          SCOUT_MODELS15: ${{ github.workspace }}/state/fast_scouts/models
        run: python -W ignore -m edges.assetbots run ../state | tail -n 10
      - name: Alerts (morning read, WATCH, tested-rule calls)
        working-directory: code
        run: python -m edges.alerts.notify ../state || true
      - name: Watch-list rule (OI-confirmed move on gold and silver, paper log)
        working-directory: code
        run: python -W ignore -m edges.watch.oi_move ../state || true
      - name: Signal Lab (event alerts and paper signals on 15 markets, scored)
        working-directory: code
        run: python -W ignore -m edges.siglab.lab ../state || true
      - name: Observer (daily market journal for the research session)
        working-directory: code
        run: python -W ignore -m edges.observer.journal ../state || true
      - name: Save
        working-directory: state
        run: |
          git config user.name "omega-assets"; git config user.email "omega-assets@users.noreply.github.com"
          git add -A assets alerts watch siglab journal; git diff --cached --quiet || git commit -q -m "asset desks $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push -q origin HEAD:bot-state && break; git pull -q --rebase origin bot-state; done
      - name: Deliver alerts (the Live API holds the Telegram / WhatsApp details)
        working-directory: state
        run: curl -s -m 150 --retry 2 "https://omega-live-api.onrender.com/alerts/pump?sha=$(git rev-parse HEAD)" || true
