# OMEGA paper bot: one paper-trading cycle every hour on GitHub's servers, so the forward record keeps growing
# without any PC or Claude session. PAPER ONLY: no exchange keys exist here, so no order can ever be placed.
# Code comes from CODE_REF; the bot's state and log live on the 'bot-state' branch (STATUS.txt = latest summary).
name: OMEGA paper bot (every 15 minutes)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (the 5m/15m watch-list rules need it; hourly rules act once per hour)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: omega-paper-bot
  cancel-in-progress: false
env:
  CODE_REF: claude/trading-edge-research-bots-gpkvi1
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
          path: code
      - name: Saved state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
      - name: Candle cache (kept between runs, not committed)
        uses: actions/cache@v4
        with:
          path: state/home/bars
          key: paperbars-${{ github.run_id }}
          restore-keys: paperbars-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet httpx pandas numpy pyarrow lightgbm scikit-learn
      - name: One paper cycle
        working-directory: code
        env:
          OMEGA_BOTS_HOME: ${{ github.workspace }}/state/home
        run: |
          mkdir -p "$OMEGA_BOTS_HOME"
          python -m edges.bots run --mode paper --once > ../state/last_run.txt 2>&1 || echo "cycle exited with $?" >> ../state/last_run.txt
          { echo "Updated $(date -u '+%Y-%m-%d %H:%M UTC') - paper only, no keys, no real orders"; echo; python -m edges.bots status; } > ../state/STATUS.txt 2>&1 || true
          tail -n 40 ../state/last_run.txt
      - name: Save state
        working-directory: state
        run: |
          git config user.name "omega-paper-bot"
          git config user.email "omega-paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "paper cycle $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push -q origin HEAD:bot-state && break; git pull -q --rebase origin bot-state; done
