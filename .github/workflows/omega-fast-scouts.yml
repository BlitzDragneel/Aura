# Fast scouts: every 15 minutes, UpScout/DownScout readings on 15-minute candles (4-hour horizon) for 30 coins,
# each scored 4 h later; fast_scouts/SCOUTS.md on the bot-state branch. Information only: no orders anywhere.
name: OMEGA fast scouts (every 15 minutes)
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 2 minutes after each 15-minute candle closes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: omega-fast-scouts
  cancel-in-progress: false
env:
  CODE_REF: claude/trading-edge-research-bots-gpkvi1
jobs:
  scouts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CODE_REF }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: bot-state, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet httpx pandas numpy pyarrow lightgbm scikit-learn
      - name: Predict and score
        working-directory: code
        env:
          SCOUT_MODELS15: ${{ github.workspace }}/state/fast_scouts/models
        run: python -W ignore -m edges.scouts.live ../state/fast_scouts --fast | tail -n 20
      - name: Save
        working-directory: state
        run: |
          git config user.name "omega-scouts"; git config user.email "omega-scouts@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -q -m "fast scouts $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push -q origin HEAD:bot-state && break; git pull -q --rebase origin bot-state; done
